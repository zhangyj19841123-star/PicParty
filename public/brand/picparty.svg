<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="163 146 880 880" role="img" aria-label="拼图派 PicParty">
  <defs>
    <linearGradient id="back-card" x1="0" y1="0" x2=".72" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffe574"/>
      <stop offset=".53" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#f7b809"/>
    </linearGradient>
    <linearGradient id="cream-card" x1="0" y1="0" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fcfaf5"/>
      <stop offset="1" stop-color="#f2ebdf"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2=".25" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#9dcc8e"/>
      <stop offset="1" stop-color="#c5e2ba"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2=".3" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#5e9f52"/>
      <stop offset="1" stop-color="#40834a"/>
    </linearGradient>
    <linearGradient id="rays" x1="0" y1="0" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffce32"/>
      <stop offset="1" stop-color="#ffb900"/>
    </linearGradient>
    <clipPath id="photo-window"><rect x="324" y="409" width="463" height="404" rx="66"/></clipPath>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="7" dy="13" stdDeviation="12" flood-color="#885d0d" flood-opacity=".27"/>
    </filter>
  </defs>
  <g id="yellow-rays" fill="url(#rays)">
    <path id="ray-up" d="M756 270c-1-14 9-26 24-27 15-1 28 10 29 25 1 7-2 15-5 23l-11 39c-2 9-8 15-17 15-9-1-15-8-16-16z"/>
    <path id="ray-diagonal" d="M844 289c9-15 25-21 39-12 16 9 19 24 11 38-4 7-11 13-17 19l-37 35c-7 6-17 8-24 1-7-6-8-14-3-22z"/>
    <path id="ray-right" d="M911 358c15-8 31-5 38 8 8 14 0 28-14 34-10 4-20 6-28 8l-47 10c-10 2-17-1-20-9-4-8 1-16 9-20z"/>
  </g>
  <rect id="yellow-card" x="387" y="462" width="550" height="466" rx="91" fill="url(#back-card)"/>
  <g id="photo-card" transform="rotate(-9 554 617)">
    <rect id="cream-edge" x="274" y="354" width="566" height="525" rx="106" fill="url(#cream-card)" filter="url(#card-shadow)"/>
    <g id="landscape" clip-path="url(#photo-window)">
      <rect x="324" y="409" width="463" height="404" fill="url(#sky)"/>
      <circle id="sun" cx="612" cy="541" r="50" fill="#fbf7ef"/>
      <path id="mountains" d="M297 749l113-111c19-18 40-20 59-2l69 69c8 8 16 9 24 2l48-36c20-15 37-15 57 0l145 114v45H297z" fill="url(#hills)"/>
    </g>
  </g>
</svg>
